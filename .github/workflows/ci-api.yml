# =============================================================================
# CI/CD Pipeline - Core API Service
# =============================================================================
#
# This workflow builds and deploys the Core API service to Coolify instance running on Hetzner.
# =============================================================================

name: CI/CD - Core API Service

on:
  # Automatic deployment on push to main/develop
  push:
    branches: [main, develop]
    paths:
      - 'services/core/**'
      - 'packages/lib/**'
      - '.github/workflows/ci-api.yml'

  # Quality gates must run BEFORE a merge, not after. The adversarial tenancy
  # suite blocks merge unconditionally (docs/API-FIRST-REBUILD.md §12.1), which
  # it cannot do if it only runs on push to main.
  pull_request:
    paths:
      - 'services/core/**'
      - 'packages/lib/**'
      - '.github/workflows/ci-api.yml'

  # Manual deployment trigger
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        type: choice
        options:
          - production
          - staging
        default: 'staging'

permissions:
  contents: read
  packages: write
  id-token: write

env:
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
  
  # Google Cloud configuration
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GAR_LOCATION: ${{ vars.GCP_REGION }}
  REPOSITORY: ${{ vars.GAR_REPOSITORY }}
  SERVICE_NAME: credopass-core
  REGION: ${{ vars.GCP_REGION }}
  
  # Docker image configuration
  IMAGE_NAME: credopass-core
  DOCKERFILE_PATH: services/core/Dockerfile

jobs:
  # ==========================================================================
  # Job 1: Quality checks (lint, typecheck, test)
  # ==========================================================================
  quality-checks:
    name: Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Derive SHAs for base and head
        if: github.event_name != 'workflow_dispatch'
        uses: nrwl/nx-set-shas@v5

      - name: Lint Core API service
        run: bun nx lint coreservice

      - name: Type check Core API service
        run: bun nx typecheck coreservice

      # Unit + structural suite: no database, so it runs everywhere and always
      # means something. Deliberately NOT given the production DATABASE_URL —
      # tests must never be able to reach the live instance.
      - name: Test Core API service (unit + structural)
        run: bun nx test coreservice

  # ==========================================================================
  # Job 2: Adversarial tenancy suite — blocks merge unconditionally
  # ==========================================================================
  # docs/API-FIRST-REBUILD.md §12.1. This is a separate job from the unit tests
  # on purpose: a tenancy failure is not "some tests are red", it is "the
  # product leaks between customers", and it should be legible as such in the
  # checks list.
  #
  # Runs against a real Postgres service container. §12.5: the suite fails
  # rather than skipping when it cannot connect, so this job cannot go green by
  # running nothing.
  # ==========================================================================
  adversarial-tenancy:
    name: Adversarial Tenancy Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: credopass_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10

    env:
      # Bypasses Testcontainers: the service container above is already a
      # throwaway Postgres, and starting a second one inside CI is wasteful.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/credopass_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Applies every committed migration to an EMPTY database (§9.4), so a
      # migration that only works incrementally against the maintainer's
      # existing schema fails here rather than at deploy time.
      - name: Adversarial suite (migrations from scratch + RLS + tenancy)
        run: bun nx run coreservice:test:adversarial

  # ==========================================================================
  # Job 3: Build application and Docker image, then deploy via Coolify
  # ==========================================================================
  build-and-deploy:
    name: Build & Deploy to Hetzner via Coolify
    runs-on: ubuntu-latest
    needs: [quality-checks, adversarial-tenancy]
    # Never deploy from a pull request, and never past a red tenancy suite.
    if: ${{ github.event_name != 'pull_request' && !failure() && !cancelled() }}
    
    environment:
      name: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production') || github.ref == 'refs/heads/main' && 'production-api' || 'staging-api' }}
      url: ${{ steps.deploy.outputs.url }}
    
    steps:
      # ----------------------------------------------------------------------
      # Step 1: Checkout and setup
      # ----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # ----------------------------------------------------------------------
      # Step 2: Install dependencies and build in CI
      # ----------------------------------------------------------------------
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Core API service
        run: |
          echo "📦 Building Core API service..."
          bun nx build coreservice
          echo "✅ Build complete!"
          
          # List build artifacts
          echo "📁 Build artifacts:"
          ls -la dist/services/core/ || echo "Build output directory not found"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          docker build \
            --file services/core/Dockerfile \
            --tag ghcr.io/codewreaker/credopass-core:${{ github.sha }} \
            --tag ghcr.io/codewreaker/credopass-core:latest \
            .
          docker push ghcr.io/codewreaker/credopass-core:latest

      - name: Deploy to Coolify
        id: deploy
        run: |
          curl --request GET '${{ secrets.COOLIFY_WEBHOOK }}' \
            --header 'Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}'