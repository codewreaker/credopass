[project]
name = "core-v2"
version = "0.1.0"
description = "CredoPass /api/v2/core — a FastAPI port of services/core, built as a learning project (docs/PYTHON-LEARNING-PLAN.md)"
readme = "README.md"
authors = [{ name = "codewreaker", email = "israel.agyeman.prempeh@gmail.com" }]
requires-python = ">=3.13"

# Runtime dependencies land week by week, with `uv add`, as the plan needs them:
#   week 1  uv add fastapi "uvicorn[standard]" pydantic-settings
#   week 2  uv add sqlalchemy asyncpg pyjwt cryptography httpx
#   week 4  uv add pydantic-ai
#   week 5  uv add "pydantic-ai[ag-ui]"
# Adding them here by hand instead would skip the one bit of packaging practice
# week 0 is meant to leave behind.
dependencies = [
    "fastapi[standard]>=0.141.1",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "ruff>=0.14.4",
]

# The importable package is `app`, not `core_v2` (which is what uv derives from
# the project name by default), so the plan's documented run command works
# verbatim:  uv run uvicorn app.main:app --reload --port 8090
[tool.uv.build-backend]
module-name = "app"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

# ---------------------------------------------------------------------------
# ruff — lint + format, the ESLint+Prettier of this service
# ---------------------------------------------------------------------------
# Deliberately a small rule set. Every rule here catches something that is a
# real bug or a real inconsistency in a FastAPI codebase; nothing is on purely
# because it was available.
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes — unused imports/names, the highest-value rules here
    "I",    # isort — import ordering
    "UP",   # pyupgrade — flags pre-3.10 typing forms (Optional[x], List[x]) automatically
    "B",    # bugbear — incl. B008, mutable default arguments
    "ASYNC",# blocking calls inside async def — the event-loop trap from plan §6
    "SIM",  # simplifiable constructs
    "RUF",  # ruff's own rules
]
ignore = [
    # FastAPI's whole dependency system is `def handler(x = Depends(...))`,
    # which is exactly what B008 exists to flag. It is correct here.
    "B008",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"

# ---------------------------------------------------------------------------
# pyright — the type checker (plan §7). `basic` for now; tighten in week 7
# once there is enough real code for `strict` to be informative rather than
# just noisy.
# ---------------------------------------------------------------------------
[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
